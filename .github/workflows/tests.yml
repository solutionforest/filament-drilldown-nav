name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (Pest + Pint + PHPStan 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, exif, gd
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: vendor/bin/pest

  demo:
    name: Demo app (Laravel 13 + Filament v5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, exif, gd
          coverage: none
          tools: composer:v2
      - name: Install demo dependencies
        working-directory: demo
        run: composer install --no-interaction --prefer-dist
      - name: Prepare app
        working-directory: demo
        run: |
          cp -n .env.example .env || true
          php artisan key:generate --force
          touch database/database.sqlite
      - name: Feature tests
        working-directory: demo
        run: php artisan test

  lowest:
    name: Lowest supported versions (Filament 5.7)
    # Proves the minimum in composer.json: the package and the demo on the oldest versions it allows.
    # Filament below 5.8.3 has published security advisories, which Composer blocks by default; this job
    # lifts that block on purpose, because it only checks that the plugin WORKS there (apps should still
    # run a patched Filament: the supported range is a compatibility range, not a security recommendation).
    env:
      COMPOSER_NO_SECURITY_BLOCKING: '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, exif, gd
          coverage: none
          tools: composer:v2
      - name: Package on lowest dependencies
        run: |
          composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
          vendor/bin/pest
      - name: Demo on the lowest allowed Filament
        working-directory: demo
        run: |
          composer install --no-interaction --prefer-dist
          composer update 'filament/*' --prefer-lowest --prefer-stable --with-all-dependencies --no-interaction --prefer-dist
          composer show filament/filament | grep versions
          cp -n .env.example .env || true
          php artisan key:generate --force
          touch database/database.sqlite
          php artisan test

  octane:
    name: Real Octane worker (${{ matrix.server }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [roadrunner, swoole, frankenphp]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, exif, gd, pcntl, sockets${{ matrix.server == 'swoole' && ', swoole' || '' }}
          coverage: none
          tools: composer:v2
      - name: Install demo dependencies
        working-directory: demo
        run: composer install --no-interaction --prefer-dist
      - name: Smoke test against a real one-worker Octane server
        working-directory: demo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/octane-smoke.sh ${{ matrix.server }}
